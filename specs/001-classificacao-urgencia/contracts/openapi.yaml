openapi: 3.1.0
info:
  title: AnimalReport - classificação automática de urgência
  version: 0.1.0
  description: |
    Rascunho. Descreve (1) o que muda nas rotas de formulário existentes e
    (2) o objeto que o agente de IA deve devolver ao serviço (contrato consumido).
    As rotas são formulários Thymeleaf que respondem com redirecionamento (302);
    não há API JSON pública nova.
paths:
  /denuncia:
    post:
      summary: Registra uma denúncia padrão; a urgência é calculada pelo sistema
      operationId: registrarDenuncia
      description: |
        O campo `nivelUrgencia` deixa de existir. Se for enviado, é ignorado (RF-008, CA-007).
        Rota pública (permitAll). Falha do serviço de IA não gera erro ao usuário.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DenunciaEntrada'
      responses:
        '302':
          description: Denúncia salva com urgência, justificativa e origem; redireciona para `/`
        '200':
          description: Erro de validação do formulário (por exemplo, descrição em branco); a página é exibida de novo
  /status/editar/{id}:
    post:
      summary: Edita uma denúncia; reclassifica se descrição ou ponto de referência mudarem
      operationId: editarDenuncia
      description: |
        Exige autenticação. `nivelUrgencia` é ignorado se enviado. A urgência só é
        recalculada quando `descricao` ou `pontoRef` mudam de valor (RF-007).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DenunciaAlteracao'
      responses:
        '302':
          description: Alterações salvas; redireciona para `/status`
        '404':
          description: Denúncia não encontrada
        '401':
          description: Usuário não autenticado
  /urgente:
    post:
      summary: Denúncia urgente (sem alteração nesta funcionalidade)
      operationId: registrarUrgente
      description: Continua gravando `EMERGENCIA` fixo; não passa pela classificação (Q-004).
      responses:
        '302':
          description: Denúncia salva; redireciona para `/`
components:
  schemas:
    EnumNivelUrgencia:
      type: string
      enum: [NAO_URGENTE, POUCO_URGENTE, URGENTE, MUITO_URGENTE, EMERGENCIA]
    EnumTipoAnimal:
      type: string
      enum: [CACHORRO, GATO, PASSARO, CAVALO, BOI, VACA, PORCO, CABRA, OVELHA, GALINHA, PATO, PEIXE, COELHO, TARTARUGA, ANIMAL_SILVESTRE, OUTRO]
    EnumOrigemClassificacao:
      type: string
      enum: [IA, REGRAS, FALLBACK, USUARIO]
    DenunciaEntrada:
      type: object
      required: [tipoAnimal, descricao, estado, municipio, bairro]
      description: Formulário de `/denuncia`. Não contém `nivelUrgencia`.
      properties:
        foto:
          type: string
          format: binary
          description: Opcional; nunca enviada ao serviço de IA
        tipoAnimal:
          $ref: '#/components/schemas/EnumTipoAnimal'
        descricao:
          type: string
          minLength: 1
        cep:
          type: string
        rua:
          type: string
        estado:
          type: string
        municipio:
          type: string
        bairro:
          type: string
        pontoRef:
          type: string
    DenunciaAlteracao:
      type: object
      description: Edição parcial; somente campos informados são alterados. Não contém `nivelUrgencia`.
      properties:
        descricao:
          type: string
        pontoRef:
          type: string
        foto:
          type: string
          format: binary
    EntradaClassificacao:
      type: object
      description: Única informação enviada ao serviço de IA (RF-003). O texto é delimitado como dado no prompt.
      required: [tipoAnimal, descricao]
      additionalProperties: false
      properties:
        tipoAnimal:
          $ref: '#/components/schemas/EnumTipoAnimal'
        descricao:
          type: string
          maxLength: 2000
          description: Proposta de limite; ver Q-014
        pontoRef:
          type: string
    ResultadoAgente:
      type: object
      description: |
        Objeto que o agente deve devolver. Validado rigidamente pelo serviço (RF-009):
        valor fora destas regras descarta a resposta inteira e aciona o fallback.
        Campos extras são ignorados.
      required: [nivel, justificativa, confianca]
      properties:
        nivel:
          $ref: '#/components/schemas/EnumNivelUrgencia'
        justificativa:
          type: string
          minLength: 1
          maxLength: 300
        confianca:
          type: number
          minimum: 0
          maximum: 1
    ResultadoClassificacao:
      type: object
      description: Resultado interno gravado na denúncia (não exposto como JSON)
      required: [nivel, justificativa, confianca, origem, versao, revisaoManual]
      properties:
        nivel:
          $ref: '#/components/schemas/EnumNivelUrgencia'
        justificativa:
          type: string
        confianca:
          type: number
          minimum: 0
          maximum: 1
        origem:
          $ref: '#/components/schemas/EnumOrigemClassificacao'
        versao:
          type: string
        revisaoManual:
          type: boolean
